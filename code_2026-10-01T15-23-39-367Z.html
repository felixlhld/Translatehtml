<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>译坊 · llama.cpp 本地翻译工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F3EFE6; --paper-hi:#FBF9F2;
  --ink:#211F1A; --ink-2:#5C574B;
  --line:#D9D2BF;
  --ver:#C63A21; --ver-deep:#9E2A15;   /* 朱砂 */
  --blue:#2C5E7E;                       /* 黛蓝 */
  --ok:#2F8F5B;
  --mono:'IBM Plex Mono','Noto Sans SC',monospace;
  --disp:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC',sans-serif;
  color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(rgba(33,31,26,.07) 1px,transparent 1.2px);
  background-size:22px 22px;
  min-height:100vh; overflow-x:hidden;
}
::selection{background:var(--ver);color:var(--paper)}

/* 巨型水印「譯」 */
.mark{
  position:fixed;right:-4vw;bottom:-14vh;z-index:0;
  font-family:var(--disp);font-size:46vmin;line-height:1;
  color:rgba(33,31,26,.045);transform:rotate(-8deg);
  pointer-events:none;user-select:none;
  animation:drift 11s ease-in-out infinite;
}
@keyframes drift{50%{transform:rotate(-8deg) translateY(-14px)}}

/* ── 顶栏 ─────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--paper);border-bottom:2px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:14px}
.seal{
  width:52px;height:52px;flex:none;
  background:var(--ver);color:var(--paper);
  font-family:var(--disp);font-size:30px;display:grid;place-items:center;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  transform:rotate(-4deg);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.brand:hover .seal{transform:rotate(0) scale(1.06)}
.brand h1{font-family:var(--disp);font-size:26px;letter-spacing:5px;line-height:1}
.brand p{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:5px;letter-spacing:.5px}

.server{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.server>label{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--ink-2)}
.server input,.server select{
  font-family:var(--mono);font-size:12px;color:var(--ink);
  background:var(--paper-hi);border:1.5px solid var(--ink);border-radius:6px;
  padding:7px 10px;transition:box-shadow .2s;
}
.server input{width:220px}
.server input:focus,.server select:focus,textarea:focus,.ctl input[type=number]:focus,.ctl input.extra:focus,.pane-head select:focus{
  outline:none;box-shadow:0 0 0 3px rgba(198,58,33,.28);
}
.status{
  display:flex;align-items:center;gap:8px;max-width:360px;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);
  padding:6px 13px;border:1.5px dashed var(--ink-2);border-radius:999px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .3s,color .3s;
}
.status.online{color:var(--ink);border-style:solid;border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:#B9B2A0;flex:none;transition:background .3s}
.status.online .dot{background:var(--ok);animation:pulse 1.8s infinite}
.status.error{color:var(--ver-deep);border-color:var(--ver)}
.status.error .dot{background:var(--ver)}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(47,143,91,.5)}
  70%{box-shadow:0 0 0 7px rgba(47,143,91,0)}
  100%{box-shadow:0 0 0 0 rgba(47,143,91,0)}
}

/* ── 主体 ─────────────────────────── */
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:30px 24px 10px}

.desk{display:grid;grid-template-columns:1fr 96px 1fr;gap:20px;align-items:stretch}
.pane{
  background:var(--paper-hi);border:2px solid var(--ink);border-radius:8px;
  box-shadow:7px 7px 0 rgba(33,31,26,.12);
  display:flex;flex-direction:column;
  transition:box-shadow .25s;
}
.pane:hover{box-shadow:9px 9px 0 rgba(33,31,26,.17)}
.pane.src{border-top:6px solid var(--blue)}
.pane.tgt{border-top:6px solid var(--ver)}
.pane-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.pane-head select{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);
  background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;
  padding:6px 28px 6px 10px;max-width:48%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23211F1A' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;
  transition:background-color .2s;
}
.pane-head select:hover{background-color:#EFEADB}
.count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.mini{
  font-size:12px;font-weight:500;color:var(--ink);font-family:inherit;
  background:transparent;border:1.5px solid transparent;border-radius:6px;
  padding:4px 10px;cursor:pointer;transition:all .18s;
}
.mini:hover{border-color:var(--ink);background:var(--paper)}
.mini:active{transform:scale(.94)}
.mini:disabled{opacity:.4;cursor:not-allowed}

#srcText{
  flex:1;border:0;background:transparent;resize:none;
  padding:16px 18px;min-height:300px;max-height:460px;overflow-y:auto;
  font-family:'Noto Sans SC',sans-serif;font-size:16px;line-height:1.9;
  color:var(--ink);caret-color:var(--blue);
}
.out{
  flex:1;padding:16px 18px;min-height:300px;max-height:460px;overflow-y:auto;
  font-size:16px;line-height:1.9;white-space:pre-wrap;word-break:break-word;
  caret-color:var(--ver);
}
.out .ph{color:#A79F8D}
.out.stream::after{content:'▌';color:var(--ver);margin-left:2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
textarea::placeholder{color:#A79F8D}

.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* 中轴桥 */
.bridge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#btnSwap{
  width:44px;height:44px;border-radius:50%;flex:none;
  border:2px solid var(--ink);background:var(--paper-hi);color:var(--ink);
  font-size:19px;cursor:pointer;box-shadow:3px 3px 0 rgba(33,31,26,.15);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;
}
#btnSwap:hover{transform:rotate(180deg);background:var(--ink);color:var(--paper)}
.go{
  flex:1;width:100%;min-height:66px;padding:0 10px;cursor:pointer;
  font-family:var(--disp);font-size:19px;letter-spacing:5px;
  color:var(--paper);background:var(--ver);
  border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);
  transition:transform .18s,box-shadow .18s,background .25s;
}
.go:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--ver-deep)}
.go:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.go.stop{background:var(--ink);letter-spacing:3px}
.go.stop:hover{background:#000;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ver)}
.bar{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden;opacity:0;transition:opacity .3s}
.bar.on{opacity:1}
.bar i{display:block;height:100%;width:36%;border-radius:2px;background:var(--ver);transform:translateX(-110%)}
.bar.on i{animation:slide 1.1s linear infinite}
@keyframes slide{to{transform:translateX(290%)}}

/* 终端条 */
.console{
  margin-top:18px;background:var(--ink);color:#9FE6B4;
  font-family:var(--mono);font-size:12px;
  padding:10px 16px;border:2px solid var(--ink);border-radius:6px;
  box-shadow:5px 5px 0 rgba(33,31,26,.12);
  white-space:nowrap;overflow-x:auto;transition:color .3s;
}
.console.err{color:#FF9E8C}

/* ── 参数与记录 ───────────────────── */
section.block{margin-top:36px}
h2.sec{
  font-family:var(--disp);font-size:21px;letter-spacing:3px;font-weight:400;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
}
h2.sec::before{content:'';width:20px;height:5px;background:var(--ver)}
h2.sec .tag{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-2);font-weight:400}
h2.sec .right{margin-left:auto;display:flex;gap:10px;align-items:center}

.params-box{
  background:var(--paper-hi);border:2px solid var(--ink);border-radius:8px;
  box-shadow:6px 6px 0 rgba(33,31,26,.12);
  padding:20px 22px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px 28px;
}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:9px;gap:10px;cursor:default}
.ctl label output{font-family:var(--mono);font-weight:600;color:var(--ver)}
.ctl input[type=range]{width:100%;height:22px;accent-color:var(--ver);cursor:pointer}
.ctl input[type=number]{width:100%;font-family:var(--mono);font-size:13px;border:1.5px solid var(--ink);border-radius:6px;padding:8px 10px;background:var(--paper);color:var(--ink)}
.ctl input.extra{width:100%;grid-column:1/-1;font-family:inherit;font-size:13px;border:1.5px solid var(--ink);border-radius:6px;padding:9px 12px;background:var(--paper);color:var(--ink)}
.switch-row{display:flex;align-items:center;gap:12px}
.switch{position:relative;display:inline-block}
.switch input{display:none}
.sw{
  position:relative;display:inline-block;width:46px;height:24px;flex:none;
  background:var(--line);border:1.5px solid var(--ink);border-radius:999px;
  cursor:pointer;transition:background .25s;
}
.sw::after{
  content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  background:var(--paper-hi);border:1.5px solid var(--ink);border-radius:50%;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.switch input:checked+.sw{background:var(--ver)}
.switch input:checked+.sw::after{transform:translateX(21px)}
.hint{font-size:12px;color:var(--ink-2)}

.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.hcard{
  position:relative;background:var(--paper-hi);border:1.5px solid var(--ink);border-radius:8px;
  padding:12px 16px;cursor:pointer;box-shadow:4px 4px 0 rgba(33,31,26,.10);
  opacity:0;transform:translateY(14px);
  transition:opacity .45s,transform .45s,box-shadow .2s;
}
.hcard.in{opacity:1;transform:none}
.hcard:hover{transform:translateY(-3px)!important;box-shadow:6px 7px 0 rgba(33,31,26,.16)}
.hcard::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;background:var(--blue);border-radius:0 3px 3px 0}
.hcard .pair{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1px;color:var(--ver)}
.hcard p{font-size:13px;line-height:1.7;margin:6px 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hcard time{font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.hcard .del{
  position:absolute;top:8px;right:8px;width:22px;height:22px;line-height:1;
  border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);
  font-size:13px;cursor:pointer;opacity:0;transition:all .2s;
}
.hcard:hover .del{opacity:1}
.hcard .del:hover{background:var(--ver);border-color:var(--ver);color:var(--paper)}
.hist-empty{
  grid-column:1/-1;text-align:center;font-size:13px;color:var(--ink-2);
  padding:22px;border:1.5px dashed var(--line);border-radius:8px;
}

footer{
  position:relative;z-index:1;margin-top:46px;padding:15px 28px;
  border-top:2px solid var(--ink);background:var(--paper);
  display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
}
kbd{border:1px solid var(--ink-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:10px;background:var(--paper-hi)}

#toast{
  position:fixed;left:50%;bottom:26px;z-index:50;pointer-events:none;
  transform:translate(-50%,90px);
  background:var(--ink);color:var(--paper);font-size:13px;
  padding:10px 22px;border-radius:6px;box-shadow:4px 4px 0 rgba(33,31,26,.2);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{transform:translate(-50%,0)}
#toast.bad{background:var(--ver-deep)}

.rise{animation:rise .55s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media(max-width:920px){
  .desk{grid-template-columns:1fr}
  .bridge{flex-direction:row;padding:2px 0}
  .go{min-height:52px;flex:2}
  .bar{width:110px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="mark">譯</div>

<header class="topbar rise">
  <div class="brand">
    <div class="seal">譯</div>
    <div>
      <h1>译 坊</h1>
      <p>llama.cpp · 本地翻译工作台</p>
    </div>
  </div>
  <div class="server">
    <label for="baseUrl">服务器</label>
    <input id="baseUrl" spellcheck="false" value="http://127.0.0.1:8085">
    <select id="apiMode" title="接口模式">
      <option value="chat">OpenAI 兼容 /v1/chat</option>
      <option value="completion">内置服务 /completion</option>
    </select>
    <button class="mini" id="btnCheck" style="border-color:var(--ink)">检测连接</button>
    <div class="status" id="statusBox"><span class="dot"></span><span id="statusText">未连接</span></div>
  </div>
</header>

<main>
  <section class="desk rise" style="animation-delay:.08s">
    <div class="pane src" id="paneSrc">
      <div class="pane-head">
        <select id="srcLang">
          <option value="自动检测">自动检测</option>
          <option value="简体中文" selected>简体中文</option>
          <option value="繁體中文">繁體中文</option>
          <option value="English">English</option>
          <option value="日本語">日本語</option>
          <option value="한국어">한국어</option>
          <option value="Français">Français</option>
          <option value="Deutsch">Deutsch</option>
          <option value="Español">Español</option>
          <option value="Português">Português</option>
          <option value="Italiano">Italiano</option>
          <option value="Русский">Русский</option>
          <option value="العربية">العربية</option>
          <option value="Tiếng Việt">Tiếng Việt</option>
          <option value="ไทย">ไทย</option>
        </select>
        <span class="count" id="srcCount">0 字</span>
        <button class="mini" id="btnClearSrc">清空</button>
      </div>
      <textarea id="srcText" placeholder="在此粘贴或输入要翻译的文本…" spellcheck="false"></textarea>
    </div>

    <div class="bridge">
      <button id="btnSwap" title="交换语言" aria-label="交换语言">⇄</button>
      <button class="go" id="btnGo">开始翻译</button>
      <div class="bar" id="bar"><i></i></div>
    </div>

    <div class="pane tgt">
      <div class="pane-head">
        <select id="tgtLang">
          <option value="自动检测">自动检测</option>
          <option value="简体中文">简体中文</option>
          <option value="繁體中文">繁體中文</option>
          <option value="English" selected>English</option>
          <option value="日本語">日本語</option>
          <option value="한국어">한국어</option>
          <option value="Français">Français</option>
          <option value="Deutsch">Deutsch</option>
          <option value="Español">Español</option>
          <option value="Português">Português</option>
          <option value="Italiano">Italiano</option>
          <option value="Русский">Русский</option>
          <option value="العربية">العربية</option>
          <option value="Tiếng Việt">Tiếng Việt</option>
          <option value="ไทย">ไทย</option>
        </select>
        <span class="count" id="tgtCount">0 字</span>
        <button class="mini" id="btnCopy">复制</button>
        <button class="mini" id="btnClearTgt">清空</button>
      </div>
      <div class="out" id="outText" aria-live="polite"><span class="ph">译文将出现在这里 —— 数据只在你与本地模型之间流动</span></div>
    </div>
  </section>

  <section class="console rise" id="consoleLine" style="animation-delay:.16s">▸ 就绪 · 点击「检测连接」确认服务状态，或直接输入文本后按 Ctrl + Enter</section>

  <section class="block rise" style="animation-delay:.24s">
    <h2 class="sec">引擎参数 <span class="tag">sampling &amp; prompt</span></h2>
    <div class="params-box">
      <div class="ctl">
        <label>温度 temperature <output id="tempOut">0.30</output></label>
        <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.3">
      </div>
      <div class="ctl">
        <label>核采样 top_p <output id="topOut">0.90</output></label>
        <input type="range" id="topP" min="0.1" max="1" step="0.05" value="0.9">
      </div>
      <div class="ctl">
        <label>最大生成 max_tokens</label>
        <input type="number" id="maxTok" min="64" max="32768" step="64" value="2048">
      </div>
      <div class="ctl">
        <label>流式输出 streaming</label>
        <div class="switch-row">
          <label class="switch"><input type="checkbox" id="stream" checked><span class="sw"></span></label>
          <span class="hint">逐字显示生成过程</span>
        </div>
      </div>
      <div class="ctl">
        <label>附加要求（选填）</label>
        <input type="text" id="extra" class="extra" placeholder="例如：保留代码块与变量名；风格偏书面正式">
      </div>
    </div>
  </section>

  <section class="block rise" style="animation-delay:.32s">
    <h2 class="sec">翻译记录 <span class="tag" id="histCount"></span>
      <span class="right"><button class="mini" id="btnClearHist">清空记录</button></span>
    </h2>
    <div class="hist-grid" id="histList"></div>
  </section>
</main>

<footer>
  <span>Ctrl + Enter 快捷翻译 · 生成中可点「停止生成」或按 Esc 中断</span>
  <span>文本仅在浏览器与你的 llama.cpp 服务之间传输 · 数据不出本机</span>
</footer>

<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const LS_SET='yifang.settings.v1', LS_HIST='yifang.hist.v1';
const PH='<span class="ph">译文将出现在这里 —— 数据只在你与本地模型之间流动</span>';

/* ── 状态 ── */
let settings={ baseUrl:'http://127.0.0.1:8085', mode:'chat', temp:0.3, topP:0.9, maxTok:2048, stream:true, extra:'' };
try{ const s=JSON.parse(localStorage.getItem(LS_SET)); if(s) Object.assign(settings,s); }catch(e){}
let history=[];
try{ history=JSON.parse(localStorage.getItem(LS_HIST))||[]; }catch(e){}
let model='', busy=false, controller=null, lastChatUrl=null;

const el={
  baseUrl:$('baseUrl'), apiMode:$('apiMode'), btnCheck:$('btnCheck'),
  statusBox:$('statusBox'), statusText:$('statusText'),
  srcLang:$('srcLang'), tgtLang:$('tgtLang'), srcText:$('srcText'),
  srcCount:$('srcCount'), tgtCount:$('tgtCount'), out:$('outText'),
  bar:$('bar'), btnGo:$('btnGo'), btnSwap:$('btnSwap'),
  temp:$('temp'), tempOut:$('tempOut'), topP:$('topP'), topOut:$('topOut'),
  maxTok:$('maxTok'), stream:$('stream'), extra:$('extra'),
  consoleLine:$('consoleLine'), histList:$('histList'), histCount:$('histCount'),
  toast:$('toast')
};

/* ── 小工具 ── */
const save=()=>localStorage.setItem(LS_SET,JSON.stringify(settings));
const normBase=()=>el.baseUrl.value.trim().replace(/\/+$/,'');
function toast(msg,bad){
  el.toast.textContent=msg;
  el.toast.className=bad?'show bad':'show';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.toast.className='',2200);
}
function log(msg,err){
  const t=new Date().toTimeString().slice(0,8);
  el.consoleLine.textContent=`▸ ${t}  ${msg}`;
  el.consoleLine.classList.toggle('err',!!err);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};

/* ── 连接检测（兼容 /v1/models 与内置 /props）── */
function setStatus(state,text){ el.statusBox.className='status '+state; el.statusText.textContent=text; }
async function fetchT(url,ms=4500){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ return await fetch(url,{signal:c.signal}); }finally{ clearTimeout(t); }
}
async function checkConnection(silent){
  const base=normBase();
  if(!base){ setStatus('error','未填写地址'); return false; }
  setStatus('','检测中…');
  const t0=performance.now();
  const tries=[
    async()=>{ const r=await fetchT(base+'/v1/models'); if(!r.ok) throw 0;
               const j=await r.json(); return (j.data&&j.data[0]&&j.data[0].id)||'model'; },
    async()=>{ const r=await fetchT(base+'/props'); if(!r.ok) throw 0;
               const j=await r.json(); return j.model||'model'; }
  ];
  for(const fn of tries){
    try{
      const m=await fn(); const ms=Math.round(performance.now()-t0);
      model=m;
      setStatus('online',`在线 · ${String(m).slice(0,28)} · ${ms}ms`);
      if(!silent) toast('连接成功');
      return true;
    }catch(e){}
  }
  model=''; lastChatUrl=null;
  setStatus('error','无法连接 · 请确认服务已启动');
  if(!silent) toast('连接失败',true);
  return false;
}

/* ── 提示词 ── */
function buildPrompts(){
  const src=el.srcLang.value, dst=el.tgtLang.value, extra=el.extra.value.trim();
  const text=el.srcText.value.trim();
  const req=extra?`额外要求：${extra}。`:'';
  const system=`你是专业翻译引擎。请将用户提供的文本从「${src}」翻译为「${dst}」。规则：只输出译文本身；不要解释、不要逐句对照、不要添加任何前缀、编号或说明；保留原文的换行、列表与代码格式；术语前后一致，符合目标语言的自然表达。${req}`;
  const chatUser=`请翻译以下文本：\n\n${text}`;
  const completion=`请将下面的文本从「${src}」翻译为「${dst}」。只输出译文，不要任何解释、前缀或说明。\n\n原文：\n${text}`;
  return {system,chatUser,completion,src,dst};
}

/* ── 流读取 ── */
async function* sseLines(res){
  const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
  while(true){
    const {done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).replace(/\r$/,'').trim();
      buf=buf.slice(i+1);
      if(line) yield line;
    }
  }
  if(buf.trim()) yield buf.trim();
}
async function* rawChunks(res){
  const reader=res.body.getReader(), dec=new TextDecoder();
  while(true){
    const {done,value}=await reader.read(); if(done)break;
    const t=dec.decode(value,{stream:true});
    if(t) yield t;
  }
}
const pickText=j=>{
  if(!j) return '';
  if(j.choices&&j.choices[0]){ const c=j.choices[0]; return c.delta?.content ?? c.text ?? ''; }
  if(typeof j.content==='string') return j.content;
  return '';
};

/* ── 翻译主流程 ── */
async function translate(){
  if(busy){ stop(); return; }
  const text=el.srcText.value.trim();
  if(!text){
    const p=$('paneSrc'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
    toast('请先输入要翻译的文本',true); return;
  }
  const {system,chatUser,completion,src,dst}=buildPrompts();
  const base=normBase(), useStream=el.stream.checked;

  busy=true; controller=new AbortController();
  setBusyUI(true);
  el.out.innerHTML='';
  const t0=performance.now();

  let url, body;
  if(el.apiMode.value==='chat'){
    url = lastChatUrl || (lastChatUrl = base+'/v1/chat/completions');
    body={
      messages:[{role:'system',content:system},{role:'user',content:chatUser}],
      temperature:+el.temp.value, top_p:+el.topP.value,
      max_tokens:+el.maxTok.value, stream:useStream
    };
    if(model) body.model=model;
  }else{
    url=base+'/completion';
    body={ prompt:completion, n_predict:+el.maxTok.value,
           temperature:+el.temp.value, top_p:+el.topP.value, stream:useStream };
  }

  try{
    let res;
    try{
      res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
    }catch(e){
      /* 旧版 llama.cpp 无 /v1 前缀，自动回退 */
      if(el.apiMode.value==='chat' && url.endsWith('/v1/chat/completions')){
        lastChatUrl=base+'/chat/completions';
        res=await fetch(lastChatUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
        url=lastChatUrl;
      }else throw e;
    }
    if(res.status===404){
      lastChatUrl=null;
      throw new Error(`404：接口 ${url} 不存在，请检查服务端版本或切换右上角的接口模式`);
    }
    if(!res.ok){
      let msg='';
      try{ const j=await res.json(); msg=j.error?.message||JSON.stringify(j); }
      catch(e){ msg=await res.text().catch(()=>''); }
      throw new Error(`HTTP ${res.status} ${msg}`.slice(0,180));
    }

    const ct=el.apiMode.value==='chat' ? (res.headers.get('content-type')||'') : (res.headers.get('content-type')||'');
    let got='';
    const append=t=>{
      if(!t) return;
      got+=t; el.out.textContent=got;
      el.out.classList.add('stream');
      el.out.scrollTop=el.out.scrollHeight;
      updateTgtCount();
    };

    if(ct.includes('application/json')){
      const j=await res.json();
      append(pickText(j)||(typeof j.content==='string'?j.content:''));
    }else if(ct.includes('event-stream')){
      for await(const line of sseLines(res)){
        if(line.startsWith('data:')){
          const d=line.slice(5).trim();
          if(d==='[DONE]') break;
          try{ append(pickText(JSON.parse(d))); }catch(e){}
        }
      }
    }else{
      for await(const chunk of rawChunks(res)) append(chunk);  /* 内置服务裸文本流 */
    }

    if(!got.trim()) throw new Error('模型未返回任何内容（可能上下文不足或 max_tokens 过小）');
    finish(true,url,text.length,performance.now()-t0,src,dst,null);
  }catch(e){
    if(e.name==='AbortError'){
      if(!el.out.textContent.trim()) el.out.textContent='（已停止，未产生内容）';
      finish(false,null,0,0,src,dst,'已停止生成，保留已输出部分');
    }else{
      let m=e.message||String(e);
      if(e instanceof TypeError) m='无法连接服务器（'+normBase()+'）。请确认 llama.cpp 已启动，例如：llama-server -m 你的模型.gguf --port 8080';
      el.out.textContent='⚠ 请求失败：'+m;
      log('失败：'+m.slice(0,140),true);
      busy=false; controller=null; setBusyUI(false); el.out.classList.remove('stream');
    }
  }
}
function finish(ok,url,n,ms,src,dst,note){
  busy=false; controller=null;
  setBusyUI(false);
  el.out.classList.remove('stream');
  const out=el.out.textContent.trim();
  if(ok){
    let path=''; try{ path=new URL(url).pathname; }catch(e){ path=url; }
    log(`POST ${path} → 200 · 输入 ${n} 字 · 输出 ${out.length} 字 · ${(ms/1000).toFixed(1)}s`);
    if(out) addHist(src,dst,el.srcText.value.trim(),out);
  }else if(note){
    log(note);
    if(out && !out.startsWith('⚠') && !out.startsWith('（已停止')) addHist(src,dst,el.srcText.value.trim(),out);
  }
}
function setBusyUI(on){
  el.btnGo.classList.toggle('stop',on);
  el.btnGo.textContent=on?'停止生成':'开始翻译';
  el.bar.classList.toggle('on',on);
  el.btnCheck.disabled=on;
}
const stop=()=>{ if(controller) controller.abort(); };

/* ── 计数 / 自适应 ── */
function updateSrcCount(){ el.srcCount.textContent=el.srcText.value.length+' 字'; }
function updateTgtCount(){ el.tgtCount.textContent=el.out.textContent.replace(/\n/g,'').length+' 字'; }
function autosize(){ const t=el.srcText; t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,460)+'px'; }

/* ── 历史记录 ── */
function addHist(s,d,src,tgt){
  history.unshift({s,d,src,tgt,time:Date.now()});
  if(history.length>12) history.length=12;
  localStorage.setItem(LS_HIST,JSON.stringify(history));
  renderHist();
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}),{threshold:.12});
function renderHist(){
  el.histCount.textContent=history.length?`共 ${history.length} 条`:'';
  if(!history.length){
    el.histList.innerHTML='<div class="hist-empty">还没有翻译记录 —— 完成一次翻译后会自动保存在这里（仅存于本浏览器）</div>';
    return;
  }
  el.histList.innerHTML=history.map((h,i)=>`
    <div class="hcard" data-i="${i}">
      <button class="del" title="删除这条记录">×</button>
      <span class="pair">${esc(h.s)} → ${esc(h.d)}</span>
      <p>${esc(h.tgt)}</p>
      <time>${fmtTime(h.time)}</time>
    </div>`).join('');
  requestAnimationFrame(()=>el.histList.querySelectorAll('.hcard').forEach(c=>io.observe(c)));
}
el.histList.addEventListener('click',e=>{
  const card=e.target.closest('.hcard'); if(!card) return;
  const i=+card.dataset.i;
  if(e.target.closest('.del')){
    history.splice(i,1); localStorage.setItem(LS_HIST,JSON.stringify(history));
    renderHist(); return;
  }
  const h=history[i];
  el.srcText.value=h.src; el.srcLang.value=h.s; el.tgtLang.value=h.d;
  el.out.textContent=h.tgt;
  updateSrcCount(); updateTgtCount(); autosize();
  document.querySelector('.desk').scrollIntoView({behavior:'smooth',block:'center'});
  toast('已载入历史记录');
});
$('btnClearHist').onclick=()=>{ history=[]; localStorage.removeItem(LS_HIST); renderHist(); toast('记录已清空'); };

/* ── 事件绑定 ── */
el.srcText.addEventListener('input',()=>{ updateSrcCount(); autosize(); });
el.btnGo.onclick=translate;
el.btnSwap.onclick=()=>{
  const a=el.srcLang.value;
  el.srcLang.value=el.tgtLang.value; el.tgtLang.value=a;
};
el.btnCheck.onclick=()=>checkConnection(false);
$('btnClearSrc').onclick=()=>{ el.srcText.value=''; updateSrcCount(); autosize(); el.srcText.focus(); };
$('btnClearTgt').onclick=()=>{ el.out.innerHTML=PH; updateTgtCount(); };
$('btnCopy').onclick=async()=>{
  const t=el.out.textContent;
  if(!t||el.out.querySelector('.ph')){ toast('暂无可复制的译文',true); return; }
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('已复制到剪贴板');
};

/* 参数读写 */
function applySettings(){
  el.baseUrl.value=settings.baseUrl; el.apiMode.value=settings.mode;
  el.temp.value=settings.temp; el.topP.value=settings.topP;
  el.maxTok.value=settings.maxTok; el.stream.checked=settings.stream;
  el.extra.value=settings.extra;
  el.tempOut.textContent=(+settings.temp).toFixed(2);
  el.topOut.textContent=(+settings.topP).toFixed(2);
}
const persist=()=>{
  settings.baseUrl=el.baseUrl.value; settings.mode=el.apiMode.value;
  settings.temp=+el.temp.value; settings.topP=+el.topP.value;
  settings.maxTok=+el.maxTok.value; settings.stream=el.stream.checked;
  settings.extra=el.extra.value;
  save();
};
el.temp.addEventListener('input',()=>{ el.tempOut.textContent=(+el.temp.value).toFixed(2); persist(); });
el.topP.addEventListener('input',()=>{ el.topOut.textContent=(+el.topP.value).toFixed(2); persist(); });
['maxTok','stream','extra'].forEach(id=>el[id].addEventListener('change',persist));
let checkTimer;
el.baseUrl.addEventListener('change',()=>{ persist(); checkConnection(true); });
el.apiMode.addEventListener('change',()=>{ lastChatUrl=null; persist(); checkConnection(true); });

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); translate(); }
  if(e.key==='Escape'&&busy) stop();
});

/* ── 启动 ── */
applySettings();
updateSrcCount(); autosize(); renderHist();
checkConnection(true);
})();
</script>
</body>
</html>
